<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64">
  <defs>
    <!-- Ocean Wave Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    
    <!-- Sunset Gold Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>

    <!-- Beacon Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE (x: 4, y: 4, size: 56x56) -->
  <g transform="translate(4, 4)">
    <!-- Outer Crest Circle -->
    <circle cx="28" cy="28" r="27" fill="url(#oceanGrad)" stroke="#90E0EF" stroke-width="1.8" filter="url(#glow)" />
    
    <!-- Rising Golden Sun -->
    <circle cx="28" cy="22" r="11" fill="url(#sunGrad)" />
    
    <!-- Lighthouse Light Beam -->
    <polygon points="28,16 50,4 46,26" fill="url(#beamGrad)" />
    <polygon points="28,16 6,4 10,26" fill="url(#beamGrad)" />

    <!-- Iconic Kapu Lighthouse Tower -->
    <polygon points="25,38 31,38 30,17 26,17" fill="#FFFFFF" />
    <polygon points="25.3,34 30.7,34 30.3,30 25.7,30" fill="#E63946" />
    <polygon points="26,26 30,26 29.7,22 26.3,22" fill="#E63946" />
    <rect x="25" y="14" width="6" height="3" rx="1" fill="#1D3557" />
    <circle cx="28" cy="14" r="2.2" fill="#FFD166" />

    <!-- Stylized Ocean Waves -->
    <path d="M 4,37 Q 12,32 20,37 T 36,37 T 52,37 L 52,50 Q 40,55 28,55 Q 16,55 4,50 Z" fill="#023E8A" opacity="0.9" />
    <path d="M 2,42 Q 10,38 19,42 T 37,42 T 54,42 L 54,52 Q 40,56 28,56 Q 16,56 2,52 Z" fill="#0077B6" />
    <path d="M 3,46 Q 11,43 21,46 T 39,46 T 53,46" fill="none" stroke="#90E0EF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- BRAND TYPOGRAPHY: NAMMA TULUNADU -->
  <g transform="translate(68, 14)">
    <!-- Primary Brand Title -->
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="20" font-weight="800" letter-spacing="0.04em" fill="url(#oceanGrad)">
      NAMMA <tspan fill="#FB8500">TULUNADU</tspan>
    </text>
    
    <!-- Subtitle / Heritage Tagline -->
    <text x="1" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.18em" fill="#0077B6" opacity="0.9">
      COASTAL KARNATAKA TOURISM
    </text>
  </g>
</svg>